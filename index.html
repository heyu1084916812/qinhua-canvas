<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- 轻画 favicon：极简黑白「画框 + 画笔点」，内联 data URI，无额外静态资源（产品文档 §16.3） -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect x='4' y='4' width='24' height='24' rx='6' fill='none' stroke='%23111' stroke-width='2.5'/%3E%3Ccircle cx='16' cy='16' r='4' fill='%23111'/%3E%3C/svg%3E"
    />
    <title>轻画</title>
    <!--
      主题首帧（不闪白）：必须在任何样式与脚本之前**同步**跑完。

      只在 React effect 里切主题的话，第一帧是 token 的默认值（亮色），effect 之后
      才翻成深色——暗色用户每次刷新都被闪一下。这里直接读 localStorage 把
      data-theme 打到 <html> 上，React 挂载后由 app/ThemeProvider 接管后续变化。

      口径与 ui/theme.ts 一致（三档：light / dark / system，非法值回落 system）：
      内联脚本不能 import，故判定逻辑在这里复述一份——它只有三行，
      值得为「不闪白」付这个代价；真正的解析规则仍以 ui/theme.ts 为准，并由单测钉住。
    -->
    <script>
      ;(function () {
        try {
          var s = localStorage.getItem('flow:theme')
          var dark =
            s === 'dark' ||
            ((s === 'system' || s !== 'light') &&
              window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches)
          var root = document.documentElement
          root.dataset.theme = dark ? 'dark' : 'light'
          root.dataset.themeSetting = s === 'light' || s === 'dark' ? s : 'system'
        } catch (e) {
          // 隐私模式 / 禁用存储：保持亮色，不该因为读不到偏好就白屏
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
