[package]
name = "qinghua-shared-store"
version = "0.1.0"
edition = "2021"

[lib]
name = "qinghua_shared_store"
path = "src/lib.rs"

[[bin]]
name = "qinghua-store"
path = "src/main.rs"

[dependencies]
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
url = "2"
