[package]
name = "qinghua"
version = "0.1.0"
description = "轻画 · 无限画布（桌面壳）"
authors = ["轻画"]
edition = "2021"
rust-version = "1.77"

# `tauri.conf.json` 的 `version` 必须与这里、以及 package.json 三处一致（发版时一起升）

[lib]
# Tauri 2 的模板布局：桌面入口 `main.rs` 只调 `lib.rs` 的 `run()`，
# 好处是同一份 `run()` 将来能直接给移动端入口复用。
name = "qinghua_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
# 自动更新（方案 §5 / 对账 #223）：下载更新包 + **验签**（公钥在 tauri.conf.json）
tauri-plugin-updater = "2"
# 取远端字节（对账 #396）：给"从网站抓站点图标"用 —— 前端 fetch 受 CORS 限制，壳里走 reqwest
# 版本 / 特性与 tauri-plugin-updater 依赖的那一份对齐（Cargo.lock 里已有 reqwest 0.13.5 + rustls）
reqwest = { version = "0.13", default-features = false, features = ["rustls", "http2"] }
# 系统通知（对账 #392 / #386 的 E5）：壳里 WebView2 那套 Notification 权限不可靠，
# 走官方插件才是"真的能弹" —— 权限由用户在设置页点按钮申请，不自动弹。
tauri-plugin-notification = "2"
